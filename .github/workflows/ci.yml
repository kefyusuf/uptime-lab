name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/ci/check-pr-title.sh "$PR_TITLE"

      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci/check-commit-range.sh "$BASE_SHA" "$HEAD_SHA"

  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Run governance tests
        run: ./scripts/ci/test-governance.sh

      - name: Run GitHub governance bootstrap tests
        run: ./scripts/github/test-configure-governance.sh

      - name: Run architecture documentation tests
        run: |
          ./scripts/ci/test-architecture-docs.sh
          ./scripts/ci/check-architecture-docs.sh .

      - name: Test migration history invariant
        run: ./scripts/ci/test-check-migration-history.sh

      - name: Validate immutable migration history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci/check-migration-history.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Validate repository invariants
        run: ./scripts/ci/check-repository-shape.sh .

      - name: Validate whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      local_dev: ${{ steps.detect.outputs.local_dev }}
      go_api: ${{ steps.detect.outputs.go_api }}
      public_contract: ${{ steps.detect.outputs.public_contract }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Test local-dev change detection
        run: ./scripts/ci/test-detect-local-dev-changes.sh

      - name: Test Go API change detection
        run: ./scripts/ci/test-detect-go-api-changes.sh

      - name: Test public-contract change detection
        run: ./scripts/ci/test-detect-public-contract-changes.sh

      - name: Detect local-dev, Go API, and public contract changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          local_dev="$(./scripts/ci/detect-local-dev-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          go_api="$(./scripts/ci/detect-go-api-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          public_contract="$(./scripts/ci/detect-public-contract-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          printf 'local_dev=%s\n' "$local_dev" >> "$GITHUB_OUTPUT"
          printf 'go_api=%s\n' "$go_api" >> "$GITHUB_OUTPUT"
          printf 'public_contract=%s\n' "$public_contract" >> "$GITHUB_OUTPUT"

  local-dev:
    name: local-dev
    needs:
      - changes
    if: ${{ needs.changes.outputs.local_dev == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: uptime-lab-ci-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Test local-dev topology checks
        run: ./scripts/ci/test-check-local-dev.sh

      - name: Test local-dev smoke harness
        run: ./scripts/ci/test-smoke-local-dev.sh

      - name: Run Docker local-dev smoke
        run: ./scripts/ci/smoke-local-dev.sh

      - name: Cleanup Docker local-dev smoke
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans || true

  go-api:
    name: go-api
    needs:
      - changes
    if: ${{ needs.changes.outputs.go_api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: uptime_lab_ci
      PGUSER: uptime_lab_ci
      PGPASSWORD: uptime_lab_ci_password
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: uptime_lab_ci
          POSTGRES_USER: uptime_lab_ci
          POSTGRES_PASSWORD: uptime_lab_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptime_lab_ci -d uptime_lab_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Verify Go static checks
        working-directory: apps/api
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod tidy
          test -z "$(git status --porcelain -- go.mod go.sum)"
          go mod verify
          go vet ./...

      - name: Verify Go architecture
        run: |
          ./scripts/ci/test-check-go-architecture.sh
          ./scripts/ci/check-go-architecture.sh .

      - name: Verify Go tests
        working-directory: apps/api
        run: |
          set -euo pipefail
          go test ./...
          go test -count=1 -race ./...

      - name: Verify PostgreSQL integration
        working-directory: apps/api
        run: |
          bash -n ../../scripts/ci/run-go-postgres-tests.sh
          go test -count=1 -tags=integration ./migrations
          go test -count=1 -tags=integration ./internal/modules/monitoring/adapters/postgres
          go test -count=1 -tags=integration ./cmd/api

      - name: Verify Go vulnerabilities
        working-directory: apps/api
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/bin/govulncheck" ./...

  public-contract:
    name: public-contract
    needs:
      - changes
    if: ${{ needs.changes.outputs.public_contract == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Verify public OpenAPI contract
        env:
          REDOCLY_TELEMETRY: 'off'
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.21.0"
          redocly_version="$(npx --yes @redocly/cli@2.53.3 --version)"
          test "$redocly_version" = "2.53.3"
          test ! -e contracts/openapi/internal.yaml
          test "$(find contracts/openapi -maxdepth 1 -type f -print | sort)" = "contracts/openapi/public.yaml"
          npx --yes @redocly/cli@2.53.3 lint --extends=spec contracts/openapi/public.yaml
          npx --yes @redocly/cli@2.53.3 bundle contracts/openapi/public.yaml --output "$RUNNER_TEMP/public-openapi.json" --ext json
          test -s "$RUNNER_TEMP/public-openapi.json"
          node scripts/ci/test-check-public-contract.mjs
          node scripts/ci/check-public-contract.mjs "$RUNNER_TEMP/public-openapi.json" .

  gate:
    name: CI / gate
    if: ${{ always() }}
    needs:
      - policy
      - repository
      - changes
      - local-dev
      - go-api
      - public-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require baseline jobs
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LOCAL_DEV_RESULT: ${{ needs.local-dev.result }}
          GO_API_RESULT: ${{ needs.go-api.result }}
          PUBLIC_CONTRACT_RESULT: ${{ needs.public-contract.result }}
        run: |
          set -euo pipefail
          test "$POLICY_RESULT" = "success"
          test "$REPOSITORY_RESULT" = "success"
          test "$CHANGES_RESULT" = "success"
          case "$LOCAL_DEV_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "$GO_API_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "$PUBLIC_CONTRACT_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
