version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /apps/api
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
