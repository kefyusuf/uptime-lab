services:
  web:
    build: ./deploy/docker/placeholder
    environment:
      SERVICE_NAME: web
    init: true
    read_only: true
    tmpfs:
      - /run/uptime-lab:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/uptime-lab/ready"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uptime_lab}
      POSTGRES_USER: ${POSTGRES_USER:-uptime_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime_lab_local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      UPTIME_LAB_HTTP_ADDR: ":8080"
      UPTIME_LAB_LOG_LEVEL: info
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-uptime_lab}
      PGUSER: ${POSTGRES_USER:-uptime_lab}
      PGPASSWORD: ${POSTGRES_PASSWORD:-uptime_lab_local}
      PGSSLMODE: disable
    init: true
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    depends_on:
      db:
        condition: service_healthy

  checker:
    build: ./deploy/docker/placeholder
    environment:
      SERVICE_NAME: checker
    init: true
    read_only: true
    tmpfs:
      - /run/uptime-lab:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/uptime-lab/ready"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
