openapi: 3.1.2
info:
  title: uptime-lab Public API
  version: 0.1.0
  description: >
    Pre-stable public contract for Monitoring registration, get-by-ID, and the
    latest terminal execution-result read and current availability assessment. The latest-result operation exposes
    execution facts only and does not derive Monitor availability status.
paths:
  /monitors:
    post:
      operationId: registerMonitor
      summary: Register a monitor
      description: >
        Registers a new monitor. Duplicate target URLs are allowed and each
        successful request creates a distinct monitor identity. Registration is
        not idempotent and does not establish that the target is safe to probe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMonitorRequest'
      responses:
        '201':
          description: Monitor registered.
          headers:
            Location:
              description: Relative reference for retrieving the created monitor.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: Malformed request content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported request media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Request content is understood but violates the monitor contract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Monitor persistence failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /monitors/{monitorId}:
    get:
      operationId: getMonitor
      summary: Get a monitor
      parameters:
        - name: monitorId
          in: path
          required: true
          description: Stable monitor UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Monitor found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: monitorId is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Monitor not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Monitor persistence failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /monitors/{monitorId}/latest-result:
    get:
      operationId: getLatestCheckResult
      summary: Get the latest terminal check result
      description: >
        Returns the latest terminal execution fact for the Monitor, ordered by
        terminal completion. Pending CheckRuns are not exposed and this read
        does not derive an up/down availability verdict.
      parameters:
        - name: monitorId
          in: path
          required: true
          description: Stable monitor UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest terminal execution result found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestCheckResult'
        '204':
          description: Monitor exists but has no terminal execution result yet.
        '400':
          description: monitorId is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Monitor not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Latest-result persistence read failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  "/monitors/{monitorId}/availability":
    "get":
      "operationId": "getMonitorAvailability"
      "parameters":
        -
          "name": "monitorId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Assessment."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MonitorAvailability"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
              "description": "Always bypass cached availability assessments."
        "400":
          "description": "Request failed."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
              "description": "Always bypass cached availability assessments."
        "404":
          "description": "Request failed."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
              "description": "Always bypass cached availability assessments."
        "500":
          "description": "Request failed."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
              "description": "Always bypass cached availability assessments."
      "summary": "Get current monitor availability"
      "description": "Read-only assessment from the latest terminal result. Future or older-than-120-second evidence is unknown; exactly 120 seconds is fresh. HTTP 200–299 is available; other valid HTTP statuses and probe failures are unavailable. Policy and execution failures are unknown. No terminal result returns unknown/no_result without evidence. All matched responses use no-store."
components:
  schemas:
    CreateMonitorRequest:
      type: object
      additionalProperties: false
      required:
        - targetUrl
      properties:
        targetUrl:
          type: string
          description: >
            Exact target text to register. The Monitoring domain accepts an
            absolute HTTP or HTTPS target with a hostname, rejects embedded
            userinfo and fragments, permits query strings and explicit ports,
            and preserves accepted input text. The public contract intentionally
            does not apply RFC 3986 format: uri because the existing domain
            parser can accept and preserve values outside that syntax.
            Registration validation is syntactic only and is not SSRF or
            execution-safety approval.
          examples:
            - https://example.com/health?region=eu
    Monitor:
      type: object
      additionalProperties: false
      required:
        - id
        - targetUrl
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Stable monitor UUID. The public contract does not guarantee a UUID version.
        targetUrl:
          type: string
          description: >
            Exact target text accepted at registration and preserved by the
            Monitoring domain. No RFC 3986 format constraint is applied.
        createdAt:
          type: string
          format: date-time
          description: Immutable monitor creation instant emitted with UTC domain semantics.
    LatestCheckResult:
      oneOf:
        - $ref: '#/components/schemas/LatestHTTPResponseResult'
        - $ref: '#/components/schemas/LatestFailureResult'
        - $ref: '#/components/schemas/LatestWorkerTimeoutResult'
    LatestHTTPResponseResult:
      type: object
      additionalProperties: false
      required:
        - checkId
        - resultKind
        - httpStatus
        - durationMs
        - completedAt
      properties:
        checkId:
          type: string
          format: uuid
          description: Durable CheckRun UUID.
        resultKind:
          type: string
          const: http_response
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: Final HTTP response status after safe redirect handling.
        durationMs:
          type: integer
          minimum: 0
          maximum: 20000
          description: Monotonic probe duration in milliseconds.
        completedAt:
          type: string
          format: date-time
          description: Persisted terminal completion instant.
    LatestFailureResult:
      type: object
      additionalProperties: false
      required:
        - checkId
        - resultKind
        - durationMs
        - completedAt
      properties:
        checkId:
          type: string
          format: uuid
          description: Durable CheckRun UUID.
        resultKind:
          type: string
          enum:
            - dns_error
            - policy_rejected
            - timeout
            - connect_error
            - tls_error
            - protocol_error
            - internal_error
        durationMs:
          type: integer
          minimum: 0
          maximum: 20000
          description: Monotonic duration until terminal failure classification.
        completedAt:
          type: string
          format: date-time
          description: Persisted terminal completion instant.
    LatestWorkerTimeoutResult:
      type: object
      additionalProperties: false
      required:
        - checkId
        - resultKind
        - completedAt
      properties:
        checkId:
          type: string
          format: uuid
          description: Durable CheckRun UUID.
        resultKind:
          type: string
          const: worker_timeout
        completedAt:
          type: string
          format: date-time
          description: Persisted terminal completion instant.
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    "MonitorAvailability":
      "oneOf":
        -
          "$ref": "#/components/schemas/AvailableMonitorAvailability"
        -
          "$ref": "#/components/schemas/UnavailableMonitorAvailability"
        -
          "$ref": "#/components/schemas/UnknownMonitorAvailability"
        -
          "$ref": "#/components/schemas/NoResultMonitorAvailability"
    "MonitorAvailabilityEvidence":
      "type": "object"
      "additionalProperties": false
      "required":
        - "checkId"
        - "completedAt"
      "properties":
        "checkId":
          "type": "string"
          "format": "uuid"
        "completedAt":
          "type": "string"
          "format": "date-time"
    "AvailableMonitorAvailability":
      "type": "object"
      "additionalProperties": false
      "required":
        - "status"
        - "reason"
        - "evaluatedAt"
        - "evidence"
      "properties":
        "status":
          "type": "string"
          "const": "available"
        "reason":
          "type": "string"
          "const": "successful_response"
        "evaluatedAt":
          "type": "string"
          "format": "date-time"
        "evidence":
          "$ref": "#/components/schemas/MonitorAvailabilityEvidence"
    "UnavailableMonitorAvailability":
      "type": "object"
      "additionalProperties": false
      "required":
        - "status"
        - "reason"
        - "evaluatedAt"
        - "evidence"
      "properties":
        "status":
          "type": "string"
          "const": "unavailable"
        "reason":
          "type": "string"
          "enum":
            - "unexpected_http_status"
            - "probe_failure"
        "evaluatedAt":
          "type": "string"
          "format": "date-time"
        "evidence":
          "$ref": "#/components/schemas/MonitorAvailabilityEvidence"
    "UnknownMonitorAvailability":
      "type": "object"
      "additionalProperties": false
      "required":
        - "status"
        - "reason"
        - "evaluatedAt"
        - "evidence"
      "properties":
        "status":
          "type": "string"
          "const": "unknown"
        "reason":
          "type": "string"
          "enum":
            - "future_result"
            - "stale_result"
            - "policy_rejected"
            - "execution_failure"
        "evaluatedAt":
          "type": "string"
          "format": "date-time"
        "evidence":
          "$ref": "#/components/schemas/MonitorAvailabilityEvidence"
    "NoResultMonitorAvailability":
      "type": "object"
      "additionalProperties": false
      "required":
        - "status"
        - "reason"
        - "evaluatedAt"
      "properties":
        "status":
          "type": "string"
          "const": "unknown"
        "reason":
          "type": "string"
          "const": "no_result"
        "evaluatedAt":
          "type": "string"
          "format": "date-time"
